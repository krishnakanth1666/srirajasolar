# Blueprint: https://render.com/docs/blueprint-spec
# Connect this repo in Render → New Blueprint Instance (or add services manually).

services:
  # Angular SPA (CDN). Public URL becomes CORS origin for the API below.
  - type: web
    name: sriraja-solar-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/contact-geo-frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # Django API
  - type: web
    name: sriraja-solar-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn contact_app.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "sriraja-solar-backend.onrender.com"
      # Browser origin is your GoDaddy site (HTTPS). Include apex + www. Add Render preview URL if you still use it.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://www.srirajasolar.com,https://srirajasolar.com,https://sriraja-solar-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://www.srirajasolar.com,https://srirajasolar.com,https://sriraja-solar-frontend.onrender.com"
