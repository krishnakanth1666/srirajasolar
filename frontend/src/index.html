    #map {
      height: 400px;

  </style>
  <script>
    function handleMapError() {
      console.error('Error loading Google Maps');
      const mapElement = document.getElementById('map');
      if (mapElement) {
        mapElement.innerHTML = '<div style="padding: 20px; text-align: center;">Error loading map. Please try again later.</div>';
      }
    }
  </script>
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCAwH8AXI9ly8SHDXS0tsv6EvUHHDjM4KE"
    onerror="handleMapError()">
  </script>
